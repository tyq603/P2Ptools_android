name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'graalvm-community'
        cache: 'maven'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android SDK components
      run: |
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        echo y | sdkmanager --licenses
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean -DskipTests
        
    - name: Build Android APK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export JAVA_HOME=/usr/lib/jvm/default-java
        echo "=== Java Version ==="
        java -version
        echo "=== Maven Version ==="
        mvn -version
        echo "=== Building APK ==="
        ./mvnw gluonfx:build -Dtarget=android -e -X 2>&1 | tee build.log
      continue-on-error: true
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
        
    - name: Package Android APK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export JAVA_HOME=/usr/lib/jvm/default-java
        echo "=== Packaging APK ==="
        ./mvnw gluonfx:package -Dtarget=android -e -X 2>&1 | tee package.log
      continue-on-error: true
      
    - name: Upload package log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: package-log
        path: package.log
        if-no-files-found: ignore
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          target/gluonfx/aarch64-android/*.apk
          target/gluonfx/x86_64-android/*.apk
        if-no-files-found: warn
